<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdde1">
        <animate attributeName="stop-color" values="#ffdde1;#ffc2d1;#ff8fab;#ffdde1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff8fab">
        <animate attributeName="stop-color" values="#ff8fab;#ff5d8f;#ffb3c6;#ff8fab" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff5d8f">
        <animate attributeName="stop-color" values="#ff5d8f;#ff2e63;#ff8fab;#ff5d8f" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif;
        font-weight: 700;
        fill: #ffffff;
      }
      .subtitle {
        font-family: 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif;
        font-weight: 400;
        fill: #fff0f3;
      }
      .tag {
        font-family: 'Courier New', monospace;
        font-weight: 600;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Decorative floating circles -->
  <circle cx="1080" cy="60" r="10" fill="#ffffff" opacity="0.25">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1130" cy="120" r="6" fill="#ffffff" opacity="0.3">
    <animate attributeName="cy" values="120;100;120" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="220" r="14" fill="#ffffff" opacity="0.2">
    <animate attributeName="cy" values="220;200;220" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="230" r="8" fill="#ffffff" opacity="0.25">
    <animate attributeName="cy" values="230;215;230" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="60" r="5" fill="#ffffff" opacity="0.3">
    <animate attributeName="cy" values="60;48;60" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom decorative waves -->
  <path d="M0,260 Q150,220 300,260 T600,260 T900,260 T1200,260 V300 H0 Z" fill="url(#waveGrad1)"/>
  <path d="M0,280 Q200,250 400,280 T800,280 T1200,280 V300 H0 Z" fill="#ffffff" opacity="0.12"/>

  <!-- Heart accent -->
  <g transform="translate(90,150)" filter="url(#glow)">
    <path d="M0,10 C0,-6 -20,-6 -20,10 C-20,24 0,36 0,36 C0,36 20,24 20,10 C20,-6 0,-6 0,10 Z"
          fill="#ffffff" opacity="0.85">
      <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>

  <!-- Main text -->
  <text x="180" y="140" class="title" font-size="52" filter="url(#glow)">
    Hi, I'm Rei 👋
  </text>

  <text x="180" y="180" class="subtitle" font-size="22">
    BSIT Student @ Polytechnic University of the Philippines
  </text>

  <!-- Tag chips -->
  <g font-size="15">
    <rect x="180" y="205" rx="14" ry="14" width="140" height="32" fill="#ffffff" opacity="0.2"/>
    <text x="200" y="226" class="tag" font-size="14">Python 🐍</text>

    <rect x="330" y="205" rx="14" ry="14" width="150" height="32" fill="#ffffff" opacity="0.2"/>
    <text x="350" y="226" class="tag" font-size="14">Data &amp; Systems</text>

    <rect x="490" y="205" rx="14" ry="14" width="170" height="32" fill="#ffffff" opacity="0.2"/>
    <text x="510" y="226" class="tag" font-size="14">Capstone Builder 💊</text>
  </g>
</svg>
